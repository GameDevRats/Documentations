site_name: Bounty Huntah Documentations
copyright: > 
  Copyright &copy; 2026 GameDevRats.
  <a href="#__consent" style="margin-left: 16px">Change cookie settings</a>
site_url: https://GameDevRats.github.io/Documentations/bounty-huntah/
  
plugins:
  - search
  - privacy
  - offline
  - social:
      enabled: !ENV [CI, false]

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vrglab/VrglabsLib
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

theme:
  # Theme name
  name: material

  direction: ltr

  custom_dir: src/.overrides

  #Icons
  #logo: assets/logo.svg
  #favicon: assets/logo.svg
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    annotation: material/arrow-right-circle

  # Features settings
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes

    - search.suggest
    - search.highlight
    - search.share

    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips

    - header.autohide

    - toc.follow
    - toc.integrate


  #Palette Data
  palette:
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: blue
      accent: blue
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: blue
      accent: blue
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - How To:
      - Injections:
          - Scene Component: how-to/injections/SceneComponenrs.md
          - Global Services: how-to/injections/GlobalServices.md
      - Player Controller:
          - Create Player Modules: how-to/player-controller/PlayerModule.md
  - Class, Functions and Utils:
      - API:
          - Assets Management:
              - IAssetManagerService: class-func-utils/api/assets-manager/IAssetManagerService.md