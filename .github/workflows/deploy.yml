
name: Deploy MkDocs Sites

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "bounty-huntah/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build documentation sites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          # Format: directory:output-path
          projects=(
            "bounty-huntah:bounty-huntah"
          )

          for project in "${projects[@]}"; do
            IFS=: read -r directory output <<< "$project"

            echo "::group::Building $directory"

            if [[ ! -f "$directory/mkdocs.yml" ]]; then
              echo "::error::Missing $directory/mkdocs.yml"
              exit 1
            fi

            if [[ ! -f "$directory/requirements.txt" ]]; then
              echo "::error::Missing $directory/requirements.txt"
              exit 1
            fi

            python -m venv "/tmp/venv-$directory"
            venv="/tmp/venv-$directory"

            "$venv/bin/python" -m pip install \
              --upgrade pip

            "$venv/bin/python" -m pip install \
              -r "$directory/requirements.txt"

            "$venv/bin/python" -m mkdocs build \
              --strict \
              --config-file "$directory/mkdocs.yml" \
              --site-dir "$GITHUB_WORKSPACE/_site/$output"

            echo "::endgroup::"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
